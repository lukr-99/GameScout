name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameScout.slnx

      - name: Format check
        run: dotnet format GameScout.slnx --verify-no-changes --severity warn

      - name: Build
        run: dotnet build GameScout.slnx -c Release --no-restore

      - name: Test
        run: dotnet test GameScout.slnx -c Release --no-build
